openapi: 3.0.3
info:
  title: Bee Platform API
  version: 0.2.0
  description: Bee storefront and commerce API. Mutations require a server session and trusted Origin.
  license:
    name: Proprietary
    url: https://example.invalid/license
servers:
  - url: /
security: []
tags:
  - name: Catalog
    description: Published catalog and metadata.
  - name: Inventory
    description: Public availability and permission-guarded warehouse adjustments.
  - name: Administration
    description: Server-authorized catalog operations.
  - name: Authentication
    description: Customer and staff sessions with server-side permissions.
  - name: Cart
    description: Owner-scoped customer cart with current prices and availability.
  - name: Orders
    description: Customer checkout and order operations.
  - name: Health
    description: Process liveness and dependency readiness.
paths:
  /api/v1/products:
    $ref: './catalog.json#/endpoints/products'
  /api/v1/products/{slug}:
    $ref: './catalog.json#/endpoints/product'
  /api/v1/catalog/metadata:
    $ref: './catalog.json#/endpoints/metadata'
  /api/v1/inventory/products/{variantId}:
    get:
      operationId: getVariantAvailability
      summary: Read published variant availability across active warehouses
      tags: [Inventory]
      parameters:
        - in: path
          name: variantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current unreserved quantity
          content:
            application/json:
              schema:
                type: object
                required: [variantId, available, warehouses]
                properties:
                  variantId: { type: string, format: uuid }
                  available: { type: integer, minimum: 0 }
                  warehouses:
                    type: array
                    items:
                      type: object
                      required: [code, available]
                      properties:
                        code: { type: string }
                        available: { type: integer, minimum: 0 }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/inventory/adjustments:
    post:
      operationId: adjustInventory
      summary: Apply an audited, idempotent warehouse stock adjustment
      tags: [Inventory]
      security:
        - AdminSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [warehouseId, variantId, delta, reason]
              properties:
                warehouseId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                delta:
                  {
                    type: integer,
                    minimum: -1000000,
                    maximum: 1000000,
                    not: { enum: [0] },
                  }
                reason: { type: string, minLength: 1, maxLength: 240 }
      responses:
        '200':
          description: Stock adjusted or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                required: [onHand, reserved, replayed]
                properties:
                  onHand: { type: integer, minimum: 0 }
                  reserved: { type: integer, minimum: 0 }
                  replayed: { type: boolean }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/warehouses:
    get:
      operationId: listWarehouses
      summary: List warehouses for inventory management
      tags: [Inventory]
      security:
        - AdminSession: []
      responses:
        '200':
          description: Configured warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, code, name, active]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: string }
                    name: { type: string }
                    active: { type: boolean }
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createWarehouse
      summary: Create a warehouse
      tags: [Inventory]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code:
                  {
                    type: string,
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$',
                    maxLength: 64,
                  }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Warehouse created and audited
          content:
            application/json:
              schema:
                type: object
                required: [id, code, name, active]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  name: { type: string }
                  active: { type: boolean }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/products:
    $ref: './catalog.json#/endpoints/adminProducts'
  /api/v1/admin/products/{id}:
    $ref: './catalog.json#/endpoints/adminProduct'
  /api/v1/admin/categories:
    $ref: './catalog.json#/endpoints/categories'
  /api/v1/admin/brands:
    $ref: './catalog.json#/endpoints/brands'
  /api/v1/admin/attributes:
    $ref: './catalog.json#/endpoints/attributes'
  /api/v1/auth/login:
    $ref: './catalog.json#/endpoints/login'
  /api/v1/auth/register:
    post:
      operationId: registerCustomer
      summary: Create a customer account and start a session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 12,
                    maxLength: 128,
                  }
      responses:
        '201':
          description: Customer account created; the session is in an HttpOnly cookie
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/auth/session:
    $ref: './catalog.json#/endpoints/session'
  /api/v1/auth/logout:
    $ref: './catalog.json#/endpoints/logout'
  /api/v1/cart:
    get:
      operationId: getCustomerCart
      summary: Get the signed-in customer's cart in the selected language
      tags: [Cart]
      security:
        - CustomerSession: []
      parameters:
        - in: query
          name: locale
          schema: { type: string, enum: [ru, ro], default: ru }
      responses:
        '200':
          description: Current cart with server prices and stock availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCart' }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/cart/items:
    post:
      operationId: setCustomerCartItem
      summary: Set a variant quantity in the signed-in customer's cart
      tags: [Cart]
      security:
        - CustomerSession: []
      parameters:
        - in: query
          name: locale
          schema: { type: string, enum: [ru, ro], default: ru }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantId, quantity]
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Updated customer cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCart' }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/cart/items/{variantId}:
    delete:
      operationId: removeCustomerCartItem
      summary: Remove a variant from the signed-in customer's cart
      tags: [Cart]
      security:
        - CustomerSession: []
      parameters:
        - in: path
          name: variantId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: locale
          schema: { type: string, enum: [ru, ro], default: ru }
      responses:
        '200':
          description: Updated customer cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCart' }
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/checkout:
    get:
      operationId: getCheckout
      summary: Get customer checkout details and shipping calculation
      tags: [Orders]
      security:
        - CustomerSession: []
      parameters:
        - in: query
          name: locale
          schema: { type: string, enum: [ru, ro], default: ru }
      responses:
        '200':
          description: Prepared checkout document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/orders:
    get:
      operationId: listCustomerOrders
      summary: List orders placed by the signed-in customer
      tags: [Orders]
      security:
        - CustomerSession: []
      responses:
        '200':
          description: List of customer orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: placeOrder
      summary: Place an order from the current cart
      tags: [Orders]
      security:
        - CustomerSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: locale
          schema: { type: string, enum: [ru, ro], default: ru }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Order idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/orders/{orderId}:
    get:
      operationId: getCustomerOrder
      summary: Get details of an order
      tags: [Orders]
      security:
        - CustomerSession: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/orders/{orderId}/cancel:
    post:
      operationId: cancelCustomerOrder
      summary: Cancel a new order
      tags: [Orders]
      security:
        - CustomerSession: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/orders:
    get:
      operationId: listAdminOrders
      summary: List orders for staff, newest first
      tags: [Orders]
      security:
        - AdminSession: []
      parameters:
        - in: query
          name: status
          schema:
            {
              type: string,
              enum: [new, confirmed, ready, shipped, completed, cancelled],
            }
        - in: query
          name: q
          description: Part of the order number, the recipient's name or phone
          schema: { type: string, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of matching orders and order counts per status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderList'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/orders/{orderId}:
    get:
      operationId: getAdminOrder
      summary: Get any order for staff
      tags: [Orders]
      security:
        - AdminSession: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/orders/{orderId}/status:
    post:
      operationId: changeOrderStatus
      summary: Move an order to its next status
      description: >
        `from` must be the status the operator saw; a changed order returns
        409 ORDER_STATUS_CHANGED. Repeating a step that already happened returns
        the order unchanged.
      tags: [Orders]
      security:
        - AdminSession: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Order after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/admin/media:
    $ref: './catalog.json#/endpoints/upload'
  /api/v1/media/{id}/{filename}:
    $ref: './catalog.json#/endpoints/image'
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Check that the API process is alive
      tags: [Health]
      responses:
        '200':
          description: Process is running.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        default:
          $ref: '#/components/responses/ApiError'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL schema and Redis connectivity
      tags: [Health]
      responses:
        '200':
          description: Required dependencies are ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency is unavailable or migrations have not been applied.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    CustomerSession:
      type: apiKey
      in: cookie
      name: bee_session
      description: HttpOnly customer or staff session cookie; cart mutations also require a configured trusted Origin.
    AdminSession:
      type: apiKey
      in: cookie
      name: bee_session
      description: HttpOnly cookie. Mutations additionally require the configured admin Origin.
  headers:
    RequestId:
      description: Server-generated correlation ID, also present in access logs.
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Request failed. No internal diagnostics are returned.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CustomerCart:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CustomerCartItem' }
    CustomerCartItem:
      type: object
      additionalProperties: false
      required:
        [
          variantId,
          productSlug,
          sku,
          name,
          variantName,
          quantity,
          unitPriceMinor,
          currency,
          available,
        ]
      properties:
        variantId: { type: string, format: uuid }
        productSlug: { type: string }
        sku: { type: string }
        name: { type: string }
        variantName: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        unitPriceMinor: { type: integer, minimum: 0 }
        currency: { type: string, enum: [MDL] }
        available: { type: integer, minimum: 0 }
    PlaceOrderRequest:
      type: object
      additionalProperties: false
      required: [deliveryMethod, recipientName, phone]
      properties:
        deliveryMethod:
          type: string
          enum: [pickup, courier, post]
        recipientName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        warehouseId:
          type: string
          format: uuid
        locality:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 240
        postalCode:
          type: string
          maxLength: 16
        comment:
          type: string
          maxLength: 500
    Checkout:
      type: object
      additionalProperties: false
      required: [cart, itemsTotalMinor, courierPriceMinor, warehouses]
      properties:
        cart:
          $ref: '#/components/schemas/CustomerCart'
        itemsTotalMinor:
          type: integer
          minimum: 0
        courierPriceMinor:
          type: integer
          nullable: true
        warehouses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, ready]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              ready:
                type: boolean
    OrderItem:
      type: object
      additionalProperties: false
      required:
        [
          variantId,
          productSlug,
          sku,
          name,
          variantName,
          unitPriceMinor,
          quantity,
        ]
      properties:
        variantId:
          type: string
          format: uuid
        productSlug:
          type: string
        sku:
          type: string
        name:
          type: string
        variantName:
          type: string
        unitPriceMinor:
          type: integer
          minimum: 0
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          status,
          createdAt,
          updatedAt,
          deliveryMethod,
          warehouse,
          recipientName,
          phone,
          locality,
          address,
          postalCode,
          comment,
          itemsTotalMinor,
          deliveryPriceMinor,
          totalMinor,
          currency,
          paymentMethod,
          trackingNumber,
          items,
          history,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          type: string
          enum: [new, confirmed, ready, shipped, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deliveryMethod:
          type: string
          enum: [pickup, courier, post]
        warehouse:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        recipientName:
          type: string
        phone:
          type: string
        locality:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        itemsTotalMinor:
          type: integer
        deliveryPriceMinor:
          type: integer
          nullable: true
        totalMinor:
          type: integer
          nullable: true
        currency:
          type: string
          enum: [MDL]
        paymentMethod:
          type: string
          enum: [on_delivery]
        trackingNumber:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, at]
            properties:
              status:
                type: string
                enum: [new, confirmed, ready, shipped, completed, cancelled]
              at:
                type: string
                format: date-time
        replayed:
          type: boolean
    OrderSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          status,
          createdAt,
          deliveryMethod,
          itemsTotalMinor,
          deliveryPriceMinor,
          totalMinor,
          currency,
          quantity,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          type: string
          enum: [new, confirmed, ready, shipped, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        deliveryMethod:
          type: string
          enum: [pickup, courier, post]
        itemsTotalMinor:
          type: integer
        deliveryPriceMinor:
          type: integer
          nullable: true
        totalMinor:
          type: integer
          nullable: true
        currency:
          type: string
          enum: [MDL]
        quantity:
          type: integer
    AdminOrderSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          status,
          createdAt,
          deliveryMethod,
          recipientName,
          phone,
          itemsTotalMinor,
          deliveryPriceMinor,
          totalMinor,
          currency,
          quantity,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        status:
          type: string
          enum: [new, confirmed, ready, shipped, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        deliveryMethod:
          type: string
          enum: [pickup, courier, post]
        recipientName:
          type: string
        phone:
          type: string
        itemsTotalMinor:
          type: integer
        deliveryPriceMinor:
          type: integer
          nullable: true
        totalMinor:
          type: integer
          nullable: true
        currency:
          type: string
          enum: [MDL]
        quantity:
          type: integer
    AdminOrderList:
      type: object
      additionalProperties: false
      required: [items, total, counts]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdminOrderSummary'
        total:
          type: integer
          minimum: 0
        counts:
          type: object
          additionalProperties: false
          required: [new, confirmed, ready, shipped, completed, cancelled]
          properties:
            new: { type: integer }
            confirmed: { type: integer }
            ready: { type: integer }
            shipped: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
    OrderStatusChange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          enum: [new, confirmed, ready, shipped, completed, cancelled]
        to:
          type: string
          enum: [confirmed, ready, shipped, completed, cancelled]
        deliveryPriceMinor:
          description: Courier or post price agreed on confirmation
          type: integer
          minimum: 0
          maximum: 100000000
        trackingNumber:
          description: Post tracking number, set when the order ships
          type: string
          minLength: 1
          maxLength: 64
    OrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderSummary'
    Product:
      $ref: './catalog.json#/schemas/Product'
    ProductDraft:
      $ref: './catalog.json#/schemas/ProductDraft'
    Metadata:
      $ref: './catalog.json#/schemas/Metadata'
    ProductPage:
      $ref: './catalog.json#/schemas/ProductPage'
    Session:
      $ref: './catalog.json#/schemas/Session'
    Image:
      $ref: './catalog.json#/schemas/Image'
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [bee-api]
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: object
          additionalProperties: false
          required: [postgres, redis]
          properties:
            postgres:
              type: string
              enum: [up]
            redis:
              type: string
              enum: [up]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
