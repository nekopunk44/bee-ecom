name: Bee CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast job: formatting, the contract and type checks fail here within minutes.
  quality:
    name: Format, contract and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run generate:api
      - run: git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: npm run check
  frontend:
    name: Tests, builds and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - run: node infra/scripts/setup.mjs
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: node infra/scripts/smoke.mjs
      - name: Catalog authentication and publishing
        run: node infra/scripts/check-catalog.mjs
      - name: Migrations are idempotent
        run: docker compose run --rm migrate
      - name: Worker preserves unknown events
        run: node infra/scripts/check-outbox.mjs
      - name: Redis outage and recovery
        run: |
          docker compose stop redis
          node infra/scripts/check-outage.mjs
          docker compose start redis
          docker compose up -d --wait --wait-timeout 120
          node infra/scripts/smoke.mjs
      - name: PostgreSQL outage and recovery
        run: |
          docker compose stop postgres
          node infra/scripts/check-outage.mjs
          docker compose start postgres
          docker compose up -d --wait --wait-timeout 120
          node infra/scripts/smoke.mjs
      # Only an image that passed the stack checks above reaches the Render demo.
      # The render target reuses the layers compose has just built.
      - name: Publish the Render demo image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/bee-ecom-api
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f infra/docker/backend.Dockerfile --target render \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$image:${{ github.sha }}" -t "$image:latest" .
          docker push --all-tags "$image"
          # Image-backed Render services do not redeploy on a new tag by themselves.
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          else
            echo "RENDER_DEPLOY_HOOK is not set; deploy the new image from the Render dashboard"
          fi
      - name: Inspect application logs
        if: always()
        run: docker compose logs --no-color api worker migrate nginx
      - name: Stop containers
        if: always()
        run: docker compose down
